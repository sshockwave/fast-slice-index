[package]
name = "logic-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "printing"] }
quote = "1.0"
proc-macro2 = "1.0"

[lints.rust]
unsafe_code = "deny"
unfulfilled_lint_expectations = "forbid"

[lints.clippy]
allow_attributes = "forbid"
